name: Cloudflare token read-only probe

# Manual diagnostic only. No checkout, build, deployment, secret changes or writes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Cloudflare API permissions (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) {
            console.error("Missing one or both existing Cloudflare Actions secrets.");
            process.exit(1);
          }

          const checks = [
            ["worker-specific settings", `/accounts/${encodeURIComponent(accountId)}/workers/scripts/kakau-lab/settings`],
            ["worker-scoped metadata (new Wrangler)", `/accounts/${encodeURIComponent(accountId)}/workers/workers/kakau-lab`],
            ["account Workers subdomain", `/accounts/${encodeURIComponent(accountId)}/workers/subdomain`],
            ["user memberships", "/memberships"],
          ];

          let unexpected = false;
          for (const [label, path] of checks) {
            try {
              const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
                method: "GET",
                headers: { Authorization: `Bearer ${token}` },
                signal: AbortSignal.timeout(15000),
              });
              const payload = await response.json().catch(() => ({}));
              const codes = Array.isArray(payload.errors)
                ? payload.errors.map((e) => Number(e.code)).filter(Number.isFinite)
                : [];
              const status = `HTTP ${response.status}; API success=${payload.success === true}; error codes=${codes.join(",") || "none"}`;
              const hasWorkerSubdomainUrl = label === "worker-scoped metadata (new Wrangler)"
                ? `; subdomain URL present=${typeof payload?.result?.subdomain?.url === "string"}`
                : "";
              console.log(`${label}: ${status}${hasWorkerSubdomainUrl}`);
              if (response.status >= 500) unexpected = true;
            } catch {
              console.log(`${label}: request/parse failed (details suppressed)`);
              unexpected = true;
            }
          }
          console.log("Diagnostic only: a 401/403 is evidence, not an authorization change.");
          console.log("This job does not establish the active Worker version or deploy success.");
          if (unexpected) process.exitCode = 1;
          NODE
